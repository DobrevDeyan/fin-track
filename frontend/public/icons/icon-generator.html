<!DOCTYPE html>
<html>
<head>
  <title>FinTrack Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #F596D3 0%, #D247BF 100%);
      color: white;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 10px;
    }
    canvas {
      background: white;
      border-radius: 10px;
      margin: 20px 0;
    }
    button {
      background: white;
      color: #D247BF;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #f0f0f0;
    }
    .sizes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 FinTrack Icon Generator</h1>
    <p>Click the buttons below to generate and download icons in different sizes.</p>
    
    <canvas id="iconCanvas" width="512" height="512"></canvas>
    
    <div class="sizes">
      <button onclick="generateIcon(72)">72x72</button>
      <button onclick="generateIcon(96)">96x96</button>
      <button onclick="generateIcon(128)">128x128</button>
      <button onclick="generateIcon(144)">144x144</button>
      <button onclick="generateIcon(152)">152x152</button>
      <button onclick="generateIcon(192)">192x192</button>
      <button onclick="generateIcon(384)">384x384</button>
      <button onclick="generateIcon(512)">512x512</button>
    </div>
    
    <button onclick="generateAllIcons()" style="background: #4ECDC4; color: white; font-weight: bold; padding: 15px 30px;">
      Generate All Icons
    </button>
  </div>

  <script>
    function drawIcon(ctx, size) {
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#F596D3');
      gradient.addColorStop(1, '#D247BF');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw "FT" text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.4}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('FT', size / 2, size / 2);
      
      // Optional: Add a border
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = size * 0.02;
      ctx.strokeRect(size * 0.05, size * 0.05, size * 0.9, size * 0.9);
    }
    
    function generateIcon(size) {
      const canvas = document.getElementById('iconCanvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      drawIcon(ctx, size);
      
      // Download
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}x${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }
    
    function generateAllIcons() {
      const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
      let index = 0;
      
      function generateNext() {
        if (index < sizes.length) {
          generateIcon(sizes[index]);
          index++;
          setTimeout(generateNext, 500); // Wait 500ms between downloads
        }
      }
      
      generateNext();
    }
    
    // Draw initial preview
    window.onload = function() {
      const canvas = document.getElementById('iconCanvas');
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, 512);
    };
  </script>
</body>
</html>
