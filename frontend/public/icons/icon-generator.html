<!DOCTYPE html>
<html>
<head>
  <title>FinTrack Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #ffffff;
      color: #000000;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #f5f5f5;
      padding: 30px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }
    canvas {
      background: white;
      border-radius: 10px;
      margin: 20px 0;
    }
    button {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #333333;
    }
    .sizes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 FinTrack Icon Generator</h1>
    <p>Click the buttons below to generate and download icons in different sizes.</p>
    
    <canvas id="iconCanvas" width="512" height="512"></canvas>
    
    <div class="sizes">
      <button onclick="generateIcon(32)">32x32 (Favicon)</button>
      <button onclick="generateIcon(72)">72x72</button>
      <button onclick="generateIcon(96)">96x96</button>
      <button onclick="generateIcon(128)">128x128</button>
      <button onclick="generateIcon(144)">144x144</button>
      <button onclick="generateIcon(152)">152x152</button>
      <button onclick="generateIcon(192)">192x192</button>
      <button onclick="generateIcon(384)">384x384</button>
      <button onclick="generateIcon(512)">512x512</button>
    </div>
    
    <button onclick="generateAllIcons()" style="background: #000000; color: white; font-weight: bold; padding: 15px 30px;">
      Generate All Icons
    </button>
  </div>

  <script>
    function drawIcon(ctx, size) {
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // Black square background with slightly rounded corners (like MarkerKit)
      const radius = size * 0.1; // ~51px for 512px - subtle rounding
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      
      // Solid black background
      ctx.fillStyle = '#000000';
      ctx.fill();
      
      // Draw "FT" text in white, centered
      ctx.fillStyle = '#FFFFFF';
      // Use a bold, sans-serif font similar to MarkerKit
      const fontSize = size * 0.35; // ~179px for 512px
      ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('FT', size / 2, size / 2);
    }
    
    function generateIcon(size) {
      const canvas = document.getElementById('iconCanvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      drawIcon(ctx, size);
      
      // Download
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}x${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }
    
    function generateAllIcons() {
      const sizes = [32, 72, 96, 128, 144, 152, 192, 384, 512];
      let index = 0;
      
      function generateNext() {
        if (index < sizes.length) {
          generateIcon(sizes[index]);
          index++;
          setTimeout(generateNext, 500); // Wait 500ms between downloads
        }
      }
      
      generateNext();
    }
    
    // Draw initial preview
    window.onload = function() {
      const canvas = document.getElementById('iconCanvas');
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, 512);
    };
  </script>
</body>
</html>
