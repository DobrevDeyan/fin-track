<!DOCTYPE html>
<html>
<head>
  <title>FinTrack Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
      color: white;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 10px;
    }
    canvas {
      background: white;
      border-radius: 10px;
      margin: 20px 0;
    }
    button {
      background: white;
      color: #1E40AF;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover {
      background: #f0f0f0;
    }
    .sizes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 FinTrack Icon Generator</h1>
    <p>Click the buttons below to generate and download icons in different sizes.</p>
    
    <canvas id="iconCanvas" width="512" height="512"></canvas>
    
    <div class="sizes">
      <button onclick="generateIcon(72)">72x72</button>
      <button onclick="generateIcon(96)">96x96</button>
      <button onclick="generateIcon(128)">128x128</button>
      <button onclick="generateIcon(144)">144x144</button>
      <button onclick="generateIcon(152)">152x152</button>
      <button onclick="generateIcon(192)">192x192</button>
      <button onclick="generateIcon(384)">384x384</button>
      <button onclick="generateIcon(512)">512x512</button>
    </div>
    
    <button onclick="generateAllIcons()" style="background: #3B82F6; color: white; font-weight: bold; padding: 15px 30px;">
      Generate All Icons
    </button>
  </div>

  <script>
    function drawIcon(ctx, size) {
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // Background with rounded corners (simulated)
      const radius = size * 0.23; // ~120px for 512px
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      
      // Background gradient (blue)
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#3B82F6');
      gradient.addColorStop(1, '#1E40AF');
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Wallet/card shape
      const cardX = size * 0.25;
      const cardY = size * 0.375;
      const cardW = size * 0.5;
      const cardH = size * 0.25;
      const cardRadius = size * 0.047; // ~24px for 512px
      
      ctx.beginPath();
      ctx.moveTo(cardX + cardRadius, cardY);
      ctx.lineTo(cardX + cardW - cardRadius, cardY);
      ctx.quadraticCurveTo(cardX + cardW, cardY, cardX + cardW, cardY + cardRadius);
      ctx.lineTo(cardX + cardW, cardY + cardH - cardRadius);
      ctx.quadraticCurveTo(cardX + cardW, cardY + cardH, cardX + cardW - cardRadius, cardY + cardH);
      ctx.lineTo(cardX + cardRadius, cardY + cardH);
      ctx.quadraticCurveTo(cardX, cardY + cardH, cardX, cardY + cardH - cardRadius);
      ctx.lineTo(cardX, cardY + cardRadius);
      ctx.quadraticCurveTo(cardX, cardY, cardX + cardRadius, cardY);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fill();
      
      // Inner card detail
      const innerX = cardX + size * 0.0625;
      const innerY = cardY + size * 0.0625;
      const innerW = cardW * 0.75;
      const innerH = cardH * 0.5;
      const innerRadius = size * 0.023;
      
      ctx.beginPath();
      ctx.moveTo(innerX + innerRadius, innerY);
      ctx.lineTo(innerX + innerW - innerRadius, innerY);
      ctx.quadraticCurveTo(innerX + innerW, innerY, innerX + innerW, innerY + innerRadius);
      ctx.lineTo(innerX + innerW, innerY + innerH - innerRadius);
      ctx.quadraticCurveTo(innerX + innerW, innerY + innerH, innerX + innerW - innerRadius, innerY + innerH);
      ctx.lineTo(innerX + innerRadius, innerY + innerH);
      ctx.quadraticCurveTo(innerX, innerY + innerH, innerX, innerY + innerH - innerRadius);
      ctx.lineTo(innerX, innerY + innerRadius);
      ctx.quadraticCurveTo(innerX, innerY, innerX + innerRadius, innerY);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fill();
      
      // Center circle with FT
      const centerX = size / 2;
      const centerY = size / 2;
      const circleRadius = size * 0.094; // ~48px for 512px
      
      ctx.beginPath();
      ctx.arc(centerX, centerY, circleRadius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fill();
      
      // Draw "FT" text
      ctx.fillStyle = '#1E40AF';
      ctx.font = `bold ${size * 0.125}px Arial`; // ~64px for 512px
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('FT', centerX, centerY);
      
      // Accent lines on the right
      const lineX = size * 0.75;
      const lineY1 = size * 0.46875;
      const lineY2 = size * 0.53125;
      const lineLength = size * 0.09375;
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = size * 0.03125; // ~16px for 512px
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lineX, lineY1);
      ctx.lineTo(lineX + lineLength, lineY1);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(lineX, lineY2);
      ctx.lineTo(lineX + lineLength, lineY2);
      ctx.stroke();
    }
    
    function generateIcon(size) {
      const canvas = document.getElementById('iconCanvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      drawIcon(ctx, size);
      
      // Download
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}x${size}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }
    
    function generateAllIcons() {
      const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
      let index = 0;
      
      function generateNext() {
        if (index < sizes.length) {
          generateIcon(sizes[index]);
          index++;
          setTimeout(generateNext, 500); // Wait 500ms between downloads
        }
      }
      
      generateNext();
    }
    
    // Draw initial preview
    window.onload = function() {
      const canvas = document.getElementById('iconCanvas');
      const ctx = canvas.getContext('2d');
      drawIcon(ctx, 512);
    };
  </script>
</body>
</html>
