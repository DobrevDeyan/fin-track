  <text x="950" y="684" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Expense</text>
  <text x="1200" y="682" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ef4444">-€68.00</text>
</svg>
