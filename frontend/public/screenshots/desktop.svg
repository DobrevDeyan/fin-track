  <text x="60" y="214" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#0f172a">€4,250.00</text>
  <rect x="60" y="228" width="48" height="16" rx="8" fill="#dcfce7"/>
  <text x="84" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#16a34a">↑ 8.2%</text>

