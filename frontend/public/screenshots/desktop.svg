  <!-- Nav links -->
  <text x="160" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#34DB96">Dashboard</text>
  <text x="270" y="40" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Reports</text>
  <text x="360" y="40" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Calendar</text>
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Settings</text>
  <!-- Right side -->
  <rect x="1130" y="18" width="120" height="28" rx="14" fill="#34DB96"/>
