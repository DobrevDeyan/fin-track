  <circle cx="80" cy="636" r="14" fill="#f1f5f9"/>
  <text x="80" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">🛒</text>
  <text x="106" y="640" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Grocery shopping</text>
  <text x="500" y="640" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Food &amp; Dining</text>
  <text x="720" y="640" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Mar 2, 2026</text>
