  <circle cx="80" cy="678" r="14" fill="#ede9fe"/>
  <text x="80" y="684" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">⚡</text>
  <text x="106" y="682" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Electricity bill</text>
  <text x="500" y="682" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Utilities</text>
  <text x="720" y="682" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Feb 28, 2026</text>
