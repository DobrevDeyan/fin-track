  <text x="360" y="178" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Monthly Income</text>
  <text x="360" y="214" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#0f172a">€3,200.00</text>
  <rect x="360" y="228" width="48" height="16" rx="8" fill="#dcfce7"/>
  <text x="384" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#16a34a">↑ 5.1%</text>

