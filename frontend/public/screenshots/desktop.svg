  <text x="950" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Expense</text>
  <text x="1200" y="640" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ef4444">-€85.00</text>
  <line x1="60" y1="652" x2="1220" y2="652" stroke="#f8fafc" stroke-width="1"/>

