  <text x="106" y="598" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Rent</text>
  <text x="500" y="598" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Housing</text>
  <text x="720" y="598" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Mar 1, 2026</text>
  <rect x="920" y="586" width="60" height="20" rx="10" fill="#fee2e2"/>
  <text x="950" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Expense</text>
  <text x="1200" y="598" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ef4444">-€950.00</text>
  <line x1="60" y1="610" x2="1220" y2="610" stroke="#f8fafc" stroke-width="1"/>

