<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Top nav bar -->
  <rect width="390" height="64" fill="#ffffff"/>
  <text x="20" y="42" font-family="Arial, sans-serif" font-weight="800" font-size="22" fill="#0f172a">Pocket</text>
  <circle cx="358" cy="32" r="18" fill="#f1f5f9"/>
  <rect x="349" y="23" width="18" height="2" rx="1" fill="#64748b"/>
  <rect x="349" y="30" width="14" height="2" rx="1" fill="#64748b"/>
  <rect x="349" y="37" width="18" height="2" rx="1" fill="#64748b"/>

  <!-- Separator -->
  <line x1="0" y1="64" x2="390" y2="64" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Page title -->
  <text x="20" y="104" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#0f172a">Dashboard</text>
  <text x="20" y="126" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Good morning, Alex</text>

  <!-- Metric cards row 1 -->
  <!-- Total Balance -->
  <rect x="12" y="144" width="175" height="92" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
  <text x="28" y="168" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Total Balance</text>
  <text x="28" y="198" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#0f172a">€4,250</text>
  <rect x="28" y="213" width="36" height="14" rx="7" fill="#dcfce7"/>
  <text x="46" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">↑ 8%</text>

  <!-- Cash Flow -->
  <rect x="203" y="144" width="175" height="92" rx="12" fill="#34DB96" filter="url(#card-shadow)"/>
  <text x="219" y="168" font-family="Arial, sans-serif" font-size="11" fill="#065f46">Cash Flow</text>
  <text x="219" y="198" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff">€1,355</text>
  <rect x="219" y="213" width="44" height="14" rx="7" fill="rgba(255,255,255,0.25)"/>
  <text x="241" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">↑ 12%</text>

  <!-- Metric cards row 2 -->
  <!-- Monthly Income -->
  <rect x="12" y="248" width="175" height="92" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
  <text x="28" y="272" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Monthly Income</text>
  <text x="28" y="302" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#0f172a">€3,200</text>
  <rect x="28" y="317" width="40" height="14" rx="7" fill="#dcfce7"/>
  <text x="48" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">↑ 5%</text>

  <!-- Monthly Spending -->
  <rect x="203" y="248" width="175" height="92" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
  <text x="219" y="272" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Spending</text>
  <text x="219" y="302" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#0f172a">€1,845</text>
  <rect x="219" y="317" width="40" height="14" rx="7" fill="#fee2e2"/>
  <text x="239" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">↑ 3%</text>

  <!-- Budget progress bar -->
  <rect x="12" y="356" width="366" height="64" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
  <text x="28" y="378" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Monthly Budget</text>
  <text x="360" y="378" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">58%</text>
  <rect x="28" y="390" width="330" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="28" y="390" width="191" height="8" rx="4" fill="#34DB96"/>

  <!-- Transactions header -->
  <text x="20" y="448" font-family="Arial, sans-serif" font-weight="600" font-size="15" fill="#0f172a">Recent Transactions</text>

  <!-- Transaction 1 -->
  <rect x="12" y="460" width="366" height="58" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
  <circle cx="42" cy="489" r="18" fill="#fef3c7"/>
  <text x="42" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🍕</text>
  <text x="72" y="483" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Dinner out</text>
  <text x="72" y="500" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Food &amp; Dining · Today</text>
  <text x="366" y="492" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ef4444">-€42</text>

  <!-- Transaction 2 -->
  <rect x="12" y="526" width="366" height="58" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
  <circle cx="42" cy="555" r="18" fill="#dcfce7"/>
  <text x="42" y="561" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">💼</text>
  <text x="72" y="549" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Salary</text>
  <text x="72" y="566" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Income · Mar 1</text>
  <text x="366" y="558" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#22c55e">+€3,200</text>

  <!-- Transaction 3 -->
  <rect x="12" y="592" width="366" height="58" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
  <circle cx="42" cy="621" r="18" fill="#f1f5f9"/>
  <text x="42" y="627" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🏠</text>
  <text x="72" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Rent</text>
  <text x="72" y="632" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Housing · Mar 1</text>
  <text x="366" y="624" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ef4444">-€950</text>

  <!-- Transaction 4 -->
  <rect x="12" y="658" width="366" height="58" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
  <circle cx="42" cy="687" r="18" fill="#f1f5f9"/>
  <text x="42" y="693" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🛒</text>
  <text x="72" y="681" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Grocery shopping</text>
  <text x="72" y="698" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Food &amp; Dining · Mar 2</text>
  <text x="366" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#ef4444">-€85</text>

  <!-- Health score chip -->
  <rect x="12" y="732" width="366" height="52" rx="12" fill="#ffffff" filter="url(#card-shadow)"/>
  <circle cx="42" cy="758" r="16" fill="#34DB96"/>
  <text x="42" y="763" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">78</text>
  <text x="70" y="754" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Financial Health Score</text>
  <text x="70" y="770" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Good · Improving</text>
  <text x="366" y="762" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">›</text>

  <!-- Bottom nav -->
  <rect y="796" width="390" height="48" fill="#ffffff"/>
  <line x1="0" y1="796" x2="390" y2="796" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="15" y="806" width="68" height="30" rx="15" fill="#f0fdf4"/>
  <text x="49" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#16a34a">Home</text>
  <text x="137" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Reports</text>
  <text x="210" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Calendar</text>
  <text x="292" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Settings</text>
  <!-- FAB -->
  <circle cx="358" cy="811" r="16" fill="#34DB96"/>
  <text x="358" y="817" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">+</text>
</svg>
